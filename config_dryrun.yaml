defaults:
  temperature: 1.0
  generate_baseline: false

providers:
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1

models:
  - id: google/gemini-3.1-pro-preview
    provider: openrouter
    extra_body:
      reasoning:
        effort: "high"
        exclude: false
  - id: z-ai/glm-5.1
    provider: openrouter
    extra_body:
      reasoning:
        effort: "high"
        exclude: false
  - id: deepseek/deepseek-v3.2
    provider: openrouter
    extra_body:
      reasoning:
        effort: "high"
        exclude: false

goal_types:
  - self_serving
  - moral
  - bare

scenarios:
  - path: scenarios/pharma_trial
    runs: 1

oversight_levels:
  - high
  - med
  - low

execution:
  max_workers: 10

output:
  dir: logs/testing_judge
  save_vfs_state: true

logging:
  level: 3
  format: "[{level}] {message}"
  output: both
  file: logs/testing_judge/exeriments.log

judge:
  log_dir: logs/judge_dryrun

  blackbox:
    model: claude-sonnet-4-20250514
    provider: anthropic
    temperature: 0

  glassbox:
    model: gpt-4.1
    provider: openai
    temperature: 0
