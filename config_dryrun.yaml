defaults:
  temperature: 1.0
  generate_baseline: false

providers:
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1

models:
  - id: google/gemini-3.1-pro-preview
    provider: openrouter
    extra_body:
      reasoning:
        effort: "high" # Using low for dry run to save tokens
        exclude: false
  - id: z-ai/glm-5
    provider: openrouter
    extra_body:
      reasoning:
        effort: "high" # Using low for dry run to save tokens
        exclude: false
  - id: deepseek/deepseek-v3.2
    provider: openrouter
    extra_body:
      reasoning:
        effort: "high" # Using low for dry run to save tokens
        exclude: false

goal_types:
  - self_serving
  - moral
  - bare

scenarios:
  - path: scenarios/pharma_trial
    runs: 1

oversight_levels:
  - high

execution:
  max_workers: 10

output:
  dir: logs/v2_dry_run
  save_vfs_state: true

logging:
  level: 4
  format: "[{level}] {message}"
  output: both
  file: logs/dry_run.log
